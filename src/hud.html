<div class="ui" id="ui">

  <!-- your own card, always up -->
  <div class="roster" id="roster" role="list" aria-label="Fighters"></div>

  <!-- and any other fighter's, only while you are pointing at them -->
  <div class="peek" id="peek" aria-hidden="true"></div>

  <!-- orders for the coming turn -->
  <section class="orders" id="orders" aria-label="Orders">
    <header>
      <span class="t">ORDERS</span>
      <span class="clock" id="clock" role="timer" aria-live="off">--</span>
    </header>
    <div class="obody">

      <!-- One control, and it is out on the arena: how far you drag the course
           handle sets your speed, and speed is bought from the same power the
           capacitor wants. There is nothing here to set, only what it costs. -->
      <div class="split2" aria-live="polite">
        <div class="fig"><span class="k">THRUST</span><b id="vThr">--</b></div>
        <div class="fig"><span class="k">RECHARGE</span><b id="vRech">--</b></div>
        <div class="fig"><span class="k">LASER</span><b id="vChg">--</b></div>
      </div>
      <div class="meter"><i id="mThr"></i></div>
      <p id="dSplit" class="sr">Drag the course handle on the arena: further is faster,
         and speed is taken from the laser's recharge.</p>

      <div class="two">
        <button class="btn fire" id="oFire" type="button" aria-pressed="false">
          <span id="fireLbl">ARM LASER</span><span class="kbd">F</span>
        </button>
        <button class="btn commit" id="oCommit" type="button">
          <span id="commitLbl">COMMIT</span><span class="kbd">↵</span>
        </button>
      </div>
    </div>
  </section>

  <!-- course handle and predicted track -->
  <div class="giz" id="giz"></div>

  <div class="banner" id="banner" style="opacity:0"><h2 id="bannerT"></h2><p id="bannerS"></p></div>


  <!-- lobby -->
  <div class="veil" id="lobby">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lobbyT">
      <h1 id="lobbyT">Prisma</h1>
      <p class="sub">Turn-based laser duelling</p>

      <div class="fld">
        <label for="lName">CALLSIGN</label>
        <input id="lName" type="text" maxlength="12" value="PILOT" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn primary" id="bSolo" type="button">PRACTICE — 3 BOTS</button>

      <div class="or">MULTIPLAYER</div>

      <div class="fld">
        <label for="lRoom">ROOM CODE <span style="color:#5c6577">— blank to matchmake</span></label>
        <input id="lRoom" type="text" maxlength="6" placeholder="ABCD" autocomplete="off"
               spellcheck="false" style="text-transform:uppercase">
      </div>
      <button class="btn" id="bJoin" type="button">JOIN ROOM</button>
      <button class="btn commit" id="bStart" type="button" style="display:none">START MATCH</button>

      <div class="status" id="lStatus"></div>
    </div>
  </div>

</div>
