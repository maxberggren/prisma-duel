  const p = document.querySelector('.panel');
  if (!p) return 0;
  const r = p.getBoundingClientRect();
  const isSheet = r.width > innerWidth * 0.8 && r.top > innerHeight * 0.35;
  return isSheet ? Math.max(0, innerHeight - r.top) : 0;
}
function updateView() {
  const availH = Math.max(80 * DPR, H - bottomInsetPx() * DPR);
  viewScale = Math.min(W / VIEW_W, availH / VIEW_H);
  viewOffX = (W - VIEW_W * viewScale) * 0.5;
  viewOffY = (availH - VIEW_H * viewScale) * 0.5;
}
let fboScene = null, mips = [], fboStreakA = null, fboStreakB = null;
let fboAcc = [null, null], accIdx = 0, accN = 0;

function allocTargets(w, h) {
  const del = f => { if (f) { gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb); } };
  del(fboScene); mips.forEach(del); del(fboStreakA); del(fboStreakB);
  fboAcc.forEach(del);
  mips = [];
  fboScene = makeFBO(w, h, HDR_FMT, HDR_TYPE);
  fboAcc = [makeFBO(w, h, HDR_FMT, HDR_TYPE), makeFBO(w, h, HDR_FMT, HDR_TYPE)];
  accN = 0;
  let mw = Math.max(1, w >> 1), mh = Math.max(1, h >> 1);
  for (let i = 0; i < 6; i++) {
    mips.push(makeFBO(mw, mh, HDR_FMT, HDR_TYPE));
    mw = Math.max(1, mw >> 1); mh = Math.max(1, mh >> 1);
    if (mw < 4 || mh < 4) break;
  }
  fboStreakA = makeFBO(Math.max(1, w >> 2), Math.max(1, h >> 2), HDR_FMT, HDR_TYPE);
  fboStreakB = makeFBO(Math.max(1, w >> 2), Math.max(1, h >> 2), HDR_FMT, HDR_TYPE);
}

let exporting = false;
function resize() {
  if (exporting) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(canvas.clientWidth * DPR));
  const h = Math.max(2, Math.round(canvas.clientHeight * DPR));
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  updateView();
  allocTargets(W, H);
  dirty = true;
}

function blit(p, target, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
  gl.useProgram(p.p);
  if (setup) setup(p.u);
  gl.bindVertexArray(vaoEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bindTex(loc, tex, unit) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(loc, unit);
}

/* --------------------------------- state ---------------------------------- */
let dirty = true;
let time = 0;
/* --- progressive supersampling ------------------------------------------- */
const ACC_MAX = 48;
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = (i / b) | 0; } return r; }
function resetAccum() { accN = 0; }
if (scene.subRays === undefined) scene.subRays = 1;
if (scene.waist === undefined) scene.waist = 0.0035;
let hoverDisc = 0, hoverEm = -1, lastHoverDisc = 0, lastHoverEm = -1;

const emitUni = new Float32Array(32);

function render(dt) {
  const aspect = W / H;
  time += dt;

  if (scene.spin) { scene.disc.wdir += dt * 0.22; dirty = true; }
  if (hoverDisc !== lastHoverDisc || hoverEm !== lastHoverEm) { lastHoverDisc = hoverDisc; lastHoverEm = hoverEm; resetAccum(); }
  if (dirty) { trace(); dirty = false; uploadSegs(); resetAccum(); }

  /* ---- 1. environment ---- */
  for (let i = 0; i < 8; i++) {
    const e = scene.emitters[i] || { x: 0, y: 0, a: 0 };
    emitUni[i * 4] = e.x; emitUni[i * 4 + 1] = e.y; emitUni[i * 4 + 2] = e.a;
    emitUni[i * 4 + 3] = 1;
  }
  const jx = halton(accN + 1, 2) - 0.5;
  const jy = halton(accN + 1, 3) - 0.5;

  blit(pEnv, fboScene, u => {
    gl.uniform2f(u.uJitter, jx, jy);
    gl.uniform2f(u.uRes, W, H);
    gl.uniform1f(u.uH, viewScale);
    gl.uniform2f(u.uOff, viewOffX, viewOffY);
    gl.uniform1f(u.uTime, time);
    gl.uniform3f(u.uDisc, scene.disc.x, scene.disc.y, scene.disc.r);
    gl.uniform2f(u.uWedge, scene.disc.wdir, scene.disc.whalf);
    gl.uniform1i(u.uNE, scene.nEmit);
    gl.uniform4fv(u.uEm, emitUni);
    gl.uniform1f(u.uHover, hoverDisc);
    gl.uniform2f(u.uHoverEm, hoverEm, 1);
  });

  /* ---- 2. beams (additive) ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fb);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  const wBase = 0.0016 * scene.beamW;
  gl.useProgram(pBeam.p);
  gl.uniform2f(pBeam.u.uRes, W, H);
  gl.uniform1f(pBeam.u.uH, viewScale);
  gl.uniform2f(pBeam.u.uOff, viewOffX, viewOffY);
  gl.uniform2f(pBeam.u.uJitter, jx, jy);
  gl.uniform1f(pBeam.u.uWidth, wBase * 6.0);
  gl.uniform1f(pBeam.u.uRefPower, traceRefPower);
  gl.uniform1f(pBeam.u.uDiv, 1.9);
  gl.uniform1f(pBeam.u.uCore, wBase * 0.62);
  gl.uniform1f(pBeam.u.uHalo, wBase * 3.0);
  gl.bindVertexArray(vaoBeam);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, segCount);

  gl.useProgram(pHot.p);
  gl.uniform2f(pHot.u.uRes, W, H);
  gl.uniform1f(pHot.u.uH, viewScale);
  gl.uniform2f(pHot.u.uOff, viewOffX, viewOffY);
  gl.uniform2f(pHot.u.uJitter, jx, jy);
  gl.uniform1f(pHot.u.uSize, 0.0090 * scene.beamW);
  gl.bindVertexArray(vaoHot);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, hotCount);

  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);

  /* ---- 2b. accumulate into the running mean ---- */
  const src = fboAcc[accIdx ^ 1];
  blit(pAccum, src, u => {
    bindTex(u.uPrev, fboAcc[accIdx].tex, 0);
    bindTex(u.uCur, fboScene.tex, 1);
    gl.uniform1f(u.uW, accN === 0 ? 1.0 : 1.0 / (accN + 1));
  });
  accIdx ^= 1;
  accN++;

  /* ---- 3. bloom chain ---- */
  blit(pBright, mips[0], u => {
    bindTex(u.uTex, src.tex, 0);
    gl.uniform1f(u.uThresh, 0.90);
    gl.uniform2f(u.uTexel, 1 / W, 1 / H);
  });
  for (let i = 1; i < mips.length; i++) {
    blit(pDown, mips[i], u => {
      bindTex(u.uTex, mips[i - 1].tex, 0);
      gl.uniform2f(u.uTexel, 1 / mips[i - 1].w, 1 / mips[i - 1].h);
    });
  }
  // upsample & accumulate back down the chain
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = mips.length - 1; i > 0; i--) {
    blit(pUp, mips[i - 1], u => {
      bindTex(u.uTex, mips[i].tex, 0);
      gl.uniform2f(u.uTexel, 1 / mips[i].w, 1 / mips[i].h);
      gl.uniform1f(u.uRad, 1.15);
    });
  }
  gl.disable(gl.BLEND);

  /* ---- 4. anamorphic streak ---- */
  blit(pStreak, fboStreakA, u => {
    bindTex(u.uTex, mips[1] ? mips[1].tex : mips[0].tex, 0);
    gl.uniform2f(u.uDir, 1.6 / fboStreakA.w, 0);
  });
  blit(pStreak, fboStreakB, u => {
    bindTex(u.uTex, fboStreakA.tex, 0);
    gl.uniform2f(u.uDir, 4.5 / fboStreakB.w, 0);
  });

  /* ---- 5. composite ---- */
  blit(pComp, null, u => {
    bindTex(u.uScene, src.tex, 0);
    bindTex(u.uBloom, mips[0].tex, 1);
    bindTex(u.uStreak, fboStreakB.tex, 2);
    gl.uniform1f(u.uExposure, exposure);
    gl.uniform1f(u.uBloomK, bloomK);
    gl.uniform1f(u.uStreakK, streakK);
    gl.uniform1f(u.uGrain, grainK);
    gl.uniform1f(u.uTime, time);
    gl.uniform2f(u.uRes, W, H);
  });
}

function uploadSegs() {
  gl.bindBuffer(gl.ARRAY_BUFFER, segBuf);
  gl.bufferData(gl.ARRAY_BUFFER, segData.subarray(0, segCount * 12), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, hotBuf);
  gl.bufferData(gl.ARRAY_BUFFER, hotData.subarray(0, hotCount * 6), gl.DYNAMIC_DRAW);
}

//#REGION INTERACT
/* =========================================================================== */
/*                                INTERACTION                                  */
/*  Direct manipulation (drag / handles / wheel / keys)  +  panel wiring.       */
/* =========================================================================== */
let exposure = 1.13, bloomK = 0.9, streakK = 0.42, grainK = 0.7;

const $ = id => document.getElementById(id);
const uiEl   = $('ui');
const panel  = $('panel');
const gizEl  = $('giz');
const hudEl  = $('hud');

/* The scene is fitted into a canonical 16:9 design space (see updateView), so
   every screen<->world conversion goes through viewScale / viewOff.           */
function viewXf() {
  const r = canvas.getBoundingClientRect();
  return { s: viewScale / DPR, ox: r.left + viewOffX / DPR, oy: r.top + viewOffY / DPR };
}
/* client coords -> world units (1.0 = design-space height, y down) */
function toWorld(ev) {
  const v = viewXf();
  return { x: (ev.clientX - v.ox) / v.s, y: (ev.clientY - v.oy) / v.s };
}

/* ------------------------------------------------------------ scrub readout */
let hudTimer = 0;
function say(unit, value) {
  hudEl.innerHTML = '<span class="u">' + unit + '</span>' + value;
  hudEl.classList.add('on');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hudEl.classList.remove('on'), 1100);
}
const deg = rad => (rad * 180 / Math.PI).toFixed(1) + '°';

/* ========================================================================== */
/*  Scene gizmos — real, always-visible handles laid over the canvas.          */
/*  aim(i)  rotate emitter i    jawA/jawB  open/close the mouth               */
/*  size    disc radius         (the rim band itself rotates the disc)         */
/* ========================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const arcs = document.createElementNS(SVGNS, 'svg');
arcs.setAttribute('class', 'arcs');
gizEl.appendChild(arcs);
function mkPath(cls) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('class', cls);
  arcs.appendChild(p);
  return p;
}
/** arc of `radius` about (cx,cy) spanning a0..a1 (screen radians, y down) */
function arcD(cx, cy, radius, a0, a1) {
  const x0 = cx + Math.cos(a0) * radius, y0 = cy + Math.sin(a0) * radius;
  const x1 = cx + Math.cos(a1) * radius, y1 = cy + Math.sin(a1) * radius;
  const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
  const sweep = a1 > a0 ? 1 : 0;
  return 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + 'A' + radius.toFixed(1) + ' ' + radius.toFixed(1) +
         ' 0 ' + large + ' ' + sweep + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
}

function mkHandle(cls, label, title) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'hnd ' + cls;
  b.setAttribute('aria-label', label);
  b.title = title;
  b.innerHTML = '<i></i>';
  gizEl.appendChild(b);
  return b;
}
/* one protractor arc + knob per possible emitter.  Each arc is drawn twice —
   a dark backing stroke under a bright stroke — so it survives on top of the
   blown-out beam it necessarily overlaps. */
const aimG = [];
const backs = [], tops = [];
for (let i = 0; i < 10; i++) backs.push(mkPath('g'));     // all dark strokes first
for (let i = 0; i < 8; i++) tops.push(mkPath('a'));
const mouthArc = mkPath('a dash'), tickArc = mkPath('a');
for (let i = 0; i < 8; i++) {
  const hnd = mkHandle('aim', 'Emitter ' + (i + 1) + ' aim angle', 'Drag to aim emitter ' + (i + 1));
  hnd.dataset.k = 'aim'; hnd.dataset.i = String(i);
  aimG.push({ back: backs[i], arc: tops[i], hnd });
}
const mouthBack = backs[8], tickBack = backs[9];
mouthBack.setAttribute('class', 'g dash');
const jawA = mkHandle('jaw', 'Mouth opening, upper face', 'Drag to open / close the mouth');
const jawB = mkHandle('jaw', 'Mouth opening, lower face', 'Drag to open / close the mouth');
const sizeH = mkHandle('size', 'Disc radius', 'Drag to resize the disc');
jawA.dataset.k = 'jawA'; jawB.dataset.k = 'jawB'; sizeH.dataset.k = 'size';

/* --- keep handles glued to the scene ------------------------------------- */
let gizSig = '';
function syncGiz() {
  const d = scene.disc;
  const sig = [d.x, d.y, d.r, d.wdir, d.whalf, scene.nEmit,
               viewScale, viewOffX, viewOffY, DPR, innerWidth, innerHeight].join() +
              scene.emitters.slice(0, scene.nEmit).map(e => e.x + ',' + e.y + ',' + e.a).join(';');
  if (sig === gizSig) return;
  gizSig = sig;

  const v = viewXf(), S = v.s;
  const CX = x => v.ox + x * S, CY = y => v.oy + y * S;

  for (let i = 0; i < 8; i++) {
    const g = aimG[i], e = scene.emitters[i];
    if (i >= scene.nEmit || !e) {
      g.hnd.classList.add('off'); g.back.setAttribute('d', ''); g.arc.setAttribute('d', '');
      continue;
    }
    g.hnd.classList.remove('off');
    // knob stand-off; floored in px so the knob never collides with the
    // emitter body when the scene is fitted small (portrait / short viewports)
    const L = Math.max(0.088 * S, 32);
    const x0 = CX(e.x), y0 = CY(e.y);
    const dd = arcD(x0, y0, L, e.a - 0.62, e.a + 0.62);
    g.back.setAttribute('d', dd); g.arc.setAttribute('d', dd);
    g.hnd.style.transform = 'translate3d(' + (x0 + Math.cos(e.a) * L) + 'px,' +
                                             (y0 + Math.sin(e.a) * L) + 'px,0)';
  }

  const cx = CX(d.x), cy = CY(d.y), R = d.r * S;
  const put = (el, ang, rad) => {
    el.style.transform = 'translate3d(' + (cx + Math.cos(ang) * rad) + 'px,' +
                                          (cy + Math.sin(ang) * rad) + 'px,0)';
  };
  put(jawA, d.wdir - d.whalf, R * 0.97);
  put(jawB, d.wdir + d.whalf, R * 0.97);
  put(sizeH, d.wdir + Math.PI, R);

  /* dashed arc completing the circle across the mouth — reads instantly as
     "this is the opening", and its ends are exactly the two jaw knobs */
  const md = arcD(cx, cy, R * 0.97, d.wdir - d.whalf, d.wdir + d.whalf);
  mouthArc.setAttribute('d', md); mouthBack.setAttribute('d', md);
  /* radial tick under the size knob */
  const sa = d.wdir + Math.PI;
  const td = 'M' + (cx + Math.cos(sa) * R * 0.90).toFixed(1) + ' ' + (cy + Math.sin(sa) * R * 0.90).toFixed(1) +
             'L' + (cx + Math.cos(sa) * R * 1.08).toFixed(1) + ' ' + (cy + Math.sin(sa) * R * 1.08).toFixed(1);
  tickArc.setAttribute('d', td); tickBack.setAttribute('d', td);
}
/* --- idle fade ---------------------------------------------------------- */
let gizIdleTimer = 0;
const GIZ_IDLE_MS = 2400;
function wakeGiz() {
  gizEl.classList.remove('idle');
  clearTimeout(gizIdleTimer);
  gizIdleTimer = setTimeout(() => {
    if (!drag && !gizEl.contains(document.activeElement)) gizEl.classList.add('idle');
  }, GIZ_IDLE_MS);
}
['pointermove', 'pointerdown', 'pointerup', 'wheel'].forEach(t =>
  addEventListener(t, wakeGiz, { passive: true }));
addEventListener('keydown', wakeGiz);
gizEl.addEventListener('focusin', wakeGiz);
wakeGiz();

function gizFrame() { syncGiz(); requestAnimationFrame(gizFrame); }
requestAnimationFrame(gizFrame);

/* ========================================================================== */
/*  Picking & dragging                                                        */
/* ========================================================================== */
let drag = null;

function pick(p) {
  for (let i = 0; i < scene.nEmit; i++) {
    const e = scene.emitters[i];
    if (Math.hypot(p.x - e.x, p.y - e.y) < 0.045) return { kind: 'emit', i };
  }
  const d = scene.disc;
  const dist = Math.hypot(p.x - d.x, p.y - d.y);
  if (dist < d.r * 1.03) {
    if (dist > d.r * 0.80) return { kind: 'discRot' };
    return { kind: 'disc' };
  }
  return null;
}

function setHover(hit) {
  hoverDisc = hit && hit.kind !== 'emit' ? 1 : 0;
  hoverEm   = hit && hit.kind === 'emit' ? hit.i : -1;
  for (let i = 0; i < 8; i++) aimG[i].arc.classList.toggle('hot', hoverEm === i);
  mouthArc.classList.toggle('hot', hoverDisc === 1);
  tickArc.classList.toggle('hot', hoverDisc === 1);
}
function beginDrag(d, ev, el) {
  drag = d;
  try { (el || canvas).setPointerCapture(ev.pointerId); } catch (err) {}
  document.body.classList.add('dragging');
  if (el) el.classList.add('act');
  hideHint();
}
function endDrag() {
  if (drag && drag.el) drag.el.classList.remove('act');
  drag = null;
  document.body.classList.remove('dragging');
}

canvas.addEventListener('pointerdown', ev => {
  const p = toWorld(ev);
  const hit = pick(p);
  setHover(hit);
  if (!hit) return;
  ev.preventDefault();
  if (hit.kind === 'emit') {
    const e = scene.emitters[hit.i];
    sel = { kind: 'emit', i: hit.i };
    beginDrag({ kind: 'move-emit', i: hit.i, ox: p.x - e.x, oy: p.y - e.y }, ev);
  } else if (hit.kind === 'disc') {
    sel = { kind: 'disc' };
    beginDrag({ kind: 'move-disc', ox: p.x - scene.disc.x, oy: p.y - scene.disc.y }, ev);
  } else {
    sel = { kind: 'disc' };
    beginDrag({ kind: 'rot-disc', a0: Math.atan2(p.y - scene.disc.y, p.x - scene.disc.x), w0: scene.disc.wdir }, ev);
  }
});

/* handles take over before the canvas ever sees the event */
gizEl.addEventListener('pointerdown', ev => {
  const el = ev.target.closest ? ev.target.closest('.hnd') : null;
  if (!el) return;
  ev.preventDefault(); ev.stopPropagation();
  el.focus({ preventScroll: true });
  const k = el.dataset.k;
  if (k === 'aim') sel = { kind: 'emit', i: +el.dataset.i };
  else sel = { kind: 'disc' };
  beginDrag({ kind: k, i: +el.dataset.i, el }, ev, el);
});
gizEl.addEventListener('pointerover', ev => {
  const el = ev.target.closest ? ev.target.closest('.hnd') : null;
  if (!el || drag) return;
  if (el.dataset.k === 'aim') setHover({ kind: 'emit', i: +el.dataset.i });
  else setHover({ kind: 'disc' });
});
gizEl.addEventListener('pointerout', ev => { if (!drag) setHover(null); });

addEventListener('pointermove', ev => {
  if (!drag) {
    if (ev.target === canvas) {
      const hit = pick(toWorld(ev));
      canvas.style.cursor = !hit ? 'default'
        : hit.kind === 'emit' ? 'grab'
        : hit.kind === 'disc' ? 'move' : 'grab';
      setHover(hit);
    }
    return;
  }
  const p = toWorld(ev);
  const d = scene.disc;
  switch (drag.kind) {
    case 'move-emit': {
      const e = scene.emitters[drag.i];
      e.x = clamp(p.x - drag.ox, 0.03, 4);
      e.y = clamp(p.y - drag.oy, 0.03, 0.97);
      canvas.style.cursor = 'grabbing';
      break;
    }
    case 'move-disc':
      d.x = p.x - drag.ox; d.y = p.y - drag.oy;
      canvas.style.cursor = 'grabbing';
      break;
    case 'rot-disc':
      d.wdir = drag.w0 + (Math.atan2(p.y - d.y, p.x - d.x) - drag.a0);
      say('MOUTH', deg(angNorm(d.wdir)));
      break;
    case 'aim': {
      const e = scene.emitters[drag.i];
      e.a = Math.atan2(p.y - e.y, p.x - e.x);
      say('AIM ' + (drag.i + 1), deg(angNorm(e.a)));
      break;
    }
    case 'jawA': case 'jawB': {
      const a = Math.atan2(p.y - d.y, p.x - d.x);
      d.whalf = clamp(Math.abs(angNorm(a - d.wdir)), 0.05, 1.4);
      say('OPENING', deg(d.whalf * 2));
      break;
    }
    case 'size':
      d.r = clamp(Math.hypot(p.x - d.x, p.y - d.y), 0.08, 0.9);
      say('RADIUS', d.r.toFixed(3));
      break;
  }
  dirty = true;
});
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

/* ------------------------------------------------------------------- wheel */
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  const d = scene.disc;
  if (ev.shiftKey) {
    d.whalf = clamp(d.whalf - ev.deltaY * 0.0012, 0.05, 1.4);
    say('OPENING', deg(d.whalf * 2));
  } else {
    d.r = clamp(d.r * (1 - ev.deltaY * 0.0009), 0.08, 0.9);
    say('RADIUS', d.r.toFixed(3));
  }
  hideHint();
  dirty = true;
}, { passive: false });

/* ========================================================================== */
/*  Keyboard                                                                  */
/* ========================================================================== */
let sel = { kind: 'disc' };
const isField = t => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

/* arrow keys on a focused handle nudge exactly that parameter */
gizEl.addEventListener('keydown', ev => {
  const el = ev.target.closest ? ev.target.closest('.hnd') : null;
  if (!el) return;
  const step = (ev.shiftKey ? 4 : 1);
  const d = scene.disc;
  let used = true;
  const dx = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
  const dy = ev.key === 'ArrowDown' ? 1 : ev.key === 'ArrowUp' ? -1 : 0;
  if (!dx && !dy) return;
  const k = el.dataset.k;
  if (k === 'aim') {
    const e = scene.emitters[+el.dataset.i];
    e.a = angNorm(e.a + (dx || dy) * 0.015 * step);
    say('AIM ' + (+el.dataset.i + 1), deg(e.a));
  } else if (k === 'size') {
    d.r = clamp(d.r + (dx - dy) * 0.006 * step, 0.08, 0.9);
    say('RADIUS', d.r.toFixed(3));
  } else {
    d.whalf = clamp(d.whalf + (dx - dy) * 0.02 * step, 0.05, 1.4);
    say('OPENING', deg(d.whalf * 2));
  }
  if (used) { ev.preventDefault(); dirty = true; }
});

addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (isField(ev.target)) return;                    // let sliders keep arrows
  if (ev.target.closest && ev.target.closest('.hnd')) return;
  const k = ev.key, d = scene.disc;
  const big = ev.shiftKey ? 4 : 1;
  let used = true;

  if (k === 'h' || k === 'H') uiEl.classList.toggle('hidden');
  else if (k === 'c' || k === 'C') toggleCollapse();
  else if (k === 'r' || k === 'R') { applyPreset(0); resetScene(); say('SCENE', 'reset'); }
  else if (k === 'm' || k === 'M') toggleMono();
  else if (k === 'o' || k === 'O') toggleSpin();
  else if (k === 's' || k === 'S') exportPNG();
  else if (k >= '1' && k <= '8') {
    const i = +k - 1;
    if (i < scene.nEmit) { sel = { kind: 'emit', i }; say('SELECT', 'emitter ' + k); }
  }
  else if (k === '0' || k === 'd' || k === 'D') { sel = { kind: 'disc' }; say('SELECT', 'disc'); }
  else if (k === '[' ) { rotSel(-0.02 * big); }
  else if (k === ']' ) { rotSel( 0.02 * big); }
  else if (k === ',' ) { d.whalf = clamp(d.whalf - 0.02 * big, 0.05, 1.4); say('OPENING', deg(d.whalf * 2)); dirty = true; }
  else if (k === '.' ) { d.whalf = clamp(d.whalf + 0.02 * big, 0.05, 1.4); say('OPENING', deg(d.whalf * 2)); dirty = true; }
  else if (k === '-' || k === '_') { d.r = clamp(d.r * 0.97, 0.08, 0.9); say('RADIUS', d.r.toFixed(3)); dirty = true; }
  else if (k === '=' || k === '+') { d.r = clamp(d.r * 1.03, 0.08, 0.9); say('RADIUS', d.r.toFixed(3)); dirty = true; }
  else if (k.indexOf('Arrow') === 0) {
    const s = 0.006 * big;
    const mx = (k === 'ArrowRight' ? s : k === 'ArrowLeft' ? -s : 0);
    const my = (k === 'ArrowDown'  ? s : k === 'ArrowUp'   ? -s : 0);
    if (sel.kind === 'emit' && scene.emitters[sel.i]) {
      const e = scene.emitters[sel.i];
      e.x = clamp(e.x + mx, 0.03, 4); e.y = clamp(e.y + my, 0.03, 0.97);
    } else { d.x += mx; d.y += my; }
    dirty = true;
  }
  else used = false;

  if (used) { ev.preventDefault(); hideHint(); }
});
function rotSel(da) {
  if (sel.kind === 'emit' && scene.emitters[sel.i]) {
    const e = scene.emitters[sel.i];
    e.a = angNorm(e.a + da);
    say('AIM ' + (sel.i + 1), deg(e.a));
  } else {
    scene.disc.wdir += da;
    say('MOUTH', deg(angNorm(scene.disc.wdir)));
  }
  dirty = true;
}

/* ========================================================================== */
/*  Panel wiring                                                              */
/* ========================================================================== */
const ctl = {};
/* `get` makes the model authoritative: the control is seeded from `scene`
   (or the camera globals) rather than from the markup's value= attribute, so
   changing a default in one place is enough and the panel can be re-synced
   from the model at any time. */
function bind(id, vid, fmt, fn, get) {
  const el = $(id), v = $(vid);
  const lo = parseFloat(el.min), hi = parseFloat(el.max);
  const upd = () => {
    const x = parseFloat(el.value);
    v.textContent = fmt(x);
    el.style.setProperty('--p', hi > lo ? (x - lo) / (hi - lo) : 0);
    fn(x); dirty = true;
  };
  el.addEventListener('input', upd);
  ctl[id] = { el, upd, get, set(x) { el.value = x; upd(); } };
  if (get) el.value = get();
  upd();
}
/** Re-seed every control from the model — used after reset / preset changes. */
function syncControls() {
  for (const id in ctl) { const c = ctl[id]; if (c.get) { c.el.value = c.get(); c.upd(); } }
}
bind('sEmit',  'vEmit',  x => x | 0,             x => { scene.nEmit = x | 0; layoutEmitters(); }, () => scene.nEmit);
bind('sRays',  'vRays',  x => x | 0,             x => scene.rays = x | 0, () => scene.rays);
bind('sPow',   'vPow',   x => x.toFixed(2),      x => scene.power = x, () => scene.power);
bind('sW',     'vW',     x => x.toFixed(2),      x => scene.beamW = x, () => scene.beamW);
bind('sIor',   'vIor',   x => x.toFixed(3),      x => scene.ior = x, () => scene.ior);
bind('sDisp',  'vDisp',  x => x.toFixed(4).slice(1), x => scene.disp = x, () => scene.disp);
bind('sB',     'vB',     x => x | 0,             x => scene.bounces = x | 0, () => scene.bounces);
bind('sExp',   'vExp',   x => x.toFixed(2),      x => exposure = x, () => exposure);
bind('sBloom', 'vBloom', x => x.toFixed(2),      x => bloomK = x, () => bloomK);
bind('sStreak','vStreak',x => x.toFixed(2),      x => streakK = x, () => streakK);
bind('sGrain', 'vGrain', x => x.toFixed(2),      x => grainK = x, () => grainK);

/* ------------------------------------------------------------------ toggles */
const bSpin = $('bSpin'), bMono = $('bMono');
function toggleSpin(v) {
  scene.spin = v === undefined ? !scene.spin : !!v;
  bSpin.setAttribute('aria-pressed', scene.spin ? 'true' : 'false');
  dirty = true;
}
function toggleMono(v) {
  scene.mono = v === undefined ? !scene.mono : !!v;
  bMono.setAttribute('aria-pressed', scene.mono ? 'true' : 'false');
  dirty = true;
}
bSpin.addEventListener('click', () => toggleSpin());
bMono.addEventListener('click', () => toggleMono());

function toggleCollapse() {
  const col = panel.classList.toggle('col');
  const b = $('bCol');
  b.setAttribute('aria-expanded', col ? 'false' : 'true');
  b.setAttribute('aria-label', col ? 'Expand panel' : 'Collapse panel');
}
$('bCol').addEventListener('click', toggleCollapse);

/* ------------------------------------------------------------------- export
   Hands off to the renderer's supersampled still exporter (it re-renders at a
   higher internal resolution and lets the accumulator converge), falling back
   to a plain canvas grab if that API is not present. */
const bShot = $('bShot'), shotLbl = bShot.querySelector('.lbl');
let expScale = 2, busy = false;
async function exportPNG() {
  if (busy) return;
  busy = true;
  bShot.disabled = true;
  shotLbl.textContent = 'Exporting…';
  say('EXPORT', expScale + '× rendering');
  try {
    const P = window.__prisma;
    if (P && P.savePNG) await P.savePNG(expScale);
    else {
      render(0);
      const b = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'prisma.png'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    }
    say('EXPORT', 'saved at ' + expScale + '×');
  } catch (err) {
    say('EXPORT', 'failed');
  } finally {
    shotLbl.textContent = 'Save PNG';
    bShot.disabled = false;
    busy = false;
  }
}
bShot.addEventListener('click', exportPNG);
$('bReset').addEventListener('click', () => { applyPreset(0); resetScene(); say('SCENE', 'reset'); });

const segBtns = Array.prototype.slice.call(document.querySelectorAll('.sgb'));
segBtns.forEach(b => b.addEventListener('click', () => {
  expScale = +b.dataset.x;
  segBtns.forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
}));

/* ------------------------------------------------------------------ presets */
const PRESETS = [
  { n: 'Studio',  disc: { x: DISC0.x, y: DISC0.y, r: DISC0.r, wdir: DISC0.wdir, whalf: DISC0.whalf }, mono: false,
    s: { sEmit: 4, sRays: 108, sPow: 1.50, sW: 1.00, sIor: 1.360, sDisp: 0.0600, sB: 8,
         sExp: 1.00, sBloom: 0.90, sStreak: 0.42, sGrain: 0.70 } },
  { n: 'Spectra', disc: { x: 0.99, y: 0.50, r: 0.405, wdir: 3.18, whalf: 0.80 }, mono: false,
    s: { sEmit: 6, sRays: 112, sPow: 1.25, sW: 0.85, sIor: 1.780, sDisp: 0.0440, sB: 12,
         sExp: 1.05, sBloom: 1.10, sStreak: 0.60, sGrain: 0.60 } },
  { n: 'Solo',    disc: { x: 0.95, y: 0.50, r: 0.445, wdir: 3.36, whalf: 1.10 }, mono: false,
    s: { sEmit: 1, sRays: 128, sPow: 1.30, sW: 1.10, sIor: 1.550, sDisp: 0.0340, sB: 12,
         sExp: 1.00, sBloom: 1.05, sStreak: 0.70, sGrain: 0.60 } },
  { n: 'Halo',    disc: { x: 0.95, y: 0.50, r: 0.340, wdir: 3.30, whalf: 0.62 }, mono: false,
    s: { sEmit: 8, sRays: 64,  sPow: 0.70, sW: 0.65, sIor: 1.950, sDisp: 0.0500, sB: 14,
         sExp: 0.95, sBloom: 1.15, sStreak: 1.00, sGrain: 0.80 } },
  { n: 'Vapour',  disc: { x: 0.90, y: 0.50, r: 0.425, wdir: 3.62, whalf: 1.24 }, mono: false,
    s: { sEmit: 3, sRays: 128, sPow: 0.55, sW: 0.60, sIor: 1.400, sDisp: 0.0120, sB: 8,
         sExp: 1.60, sBloom: 0.45, sStreak: 0.20, sGrain: 1.05 } },
  { n: 'Nocturne',disc: { x: 0.96, y: 0.52, r: 0.330, wdir: 3.15, whalf: 1.05 }, mono: false,
    s: { sEmit: 4, sRays: 110, sPow: 1.35, sW: 0.60, sIor: 2.050, sDisp: 0.0520, sB: 13,
         sExp: 0.85, sBloom: 1.50, sStreak: 1.15, sGrain: 0.45 } }
];
const chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
function applyPreset(n) {
  const P = PRESETS[n]; if (!P) return;
  Object.assign(scene.disc, P.disc);
  scene.disc.spin = 0;
  for (const k in P.s) if (ctl[k]) ctl[k].set(P.s[k]);
  toggleMono(P.mono);
  layoutEmitters();
  chips.forEach((c, i) => c.setAttribute('aria-pressed', i === n ? 'true' : 'false'));
  dirty = true;
}
chips.forEach(c => c.addEventListener('click', () => {
  const n = +c.dataset.p;
  applyPreset(n);
  say('PRESET', PRESETS[n].n);
  hideHint();
}));

/* ?clean=1 renders the artwork alone — used for art-direction review and for
   exporting stills without the instrument panel. */
if (new URLSearchParams(location.search).has('clean')) uiEl.style.display = 'none';

/* --------------------------------------------------------------------- hint */
let hintTimer = setTimeout(hideHint, 11000);
function hideHint() { $('hint').classList.add('gone'); clearTimeout(hintTimer); }
//#ENDREGION INTERACT

/* --------------------------------- main loop ------------------------------ */
resetScene();
resize();
addEventListener('resize', resize);

/* A lost GPU context (driver reset, tab suspended on some machines) would
   otherwise leave a permanently black canvas.  Stop the loop, then rebuild
   every GL resource when the context comes back. */
let ctxLost = false;
canvas.addEventListener('webglcontextlost', ev => { ev.preventDefault(); ctxLost = true; }, false);
canvas.addEventListener('webglcontextrestored', () => {
  try {
    allocTargets(W, H);
    ctxLost = false;
    dirty = true;
  } catch (e) { console.error('context restore failed', e); }
}, false);

/* the sheet's height changes when it collapses or the device rotates */
if (window.ResizeObserver) {
  const pnl = document.querySelector('.panel');
  if (pnl) new ResizeObserver(() => { updateView(); dirty = true; }).observe(pnl);
}

let last = performance.now(), fpsAcc = 0, fpsN = 0;
const fpsEl = document.getElementById('fps');
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!ctxLost) {
    resize();
    // A converged still is finished: re-rendering it would blend un-jittered
    // frames back in and undo the supersampling, and it burns the GPU forever.
    if (dirty || scene.spin || accN < ACC_MAX) render(dt);
  }
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' FPS · ' + segCount + ' rays'; fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ------------------------------------------------------------ still export
   Re-renders the frame at a higher internal resolution and lets the
   progressive accumulator fully converge before reading the pixels back, so an
   exported still is cleanly supersampled rather than a screen grab. */
async function exportStill(scale = 2, samples = ACC_MAX) {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  // keep every float target within a sane VRAM budget (~16 Mpx)
  const maxPx = 16e6;
  scale = Math.max(1, Math.min(scale, Math.sqrt(maxPx / Math.max(1, cw * ch))));
  exporting = true;
  const prevW = W, prevH = H;
  try {
    W = Math.max(2, Math.round(cw * scale));
    H = Math.max(2, Math.round(ch * scale));
    canvas.width = W; canvas.height = H;
    updateView();
    allocTargets(W, H);
    dirty = true;
    for (let i = 0; i < samples; i++) render(0);
    return await new Promise(res => canvas.toBlob(res, 'image/png'));
  } finally {
    exporting = false;
    W = prevW; H = prevH;
    canvas.width = 2; canvas.height = 2;      // force resize() to rebuild
    W = H = 0;
    resize();
    dirty = true;
  }
}
async function savePNG(scale = 2) {
  const blob = await exportStill(scale);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'prisma-' + W + 'x' + H + '.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}

window.__prisma = { scene, render, exportStill, savePNG, resetAccum, trace };
</script>
